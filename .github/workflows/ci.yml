name: CI


on:

  push:

    branches:
      - main
      - develop

  pull_request:


jobs:

  quality:

    name: Quality and Tests

    runs-on: ubuntu-latest

    services:

      postgres:

        image: pgvector/pgvector:pg17

        env:
          POSTGRES_DB: jobintel
          POSTGRES_USER: jobintel
          POSTGRES_PASSWORD: jobintel_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U jobintel -d jobintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10


    env:

      DATABASE_URL: >-
        postgresql+psycopg://jobintel:jobintel_dev@localhost:5432/jobintel

      TEMPORAL_ADDRESS: localhost:7233

      TEMPORAL_NAMESPACE: default

      TEMPORAL_TASK_QUEUE: job-intelligence-pipeline


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.13"
          cache: pip


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install project
        run: |
          pip install -e ".[dev]"


      - name: Ruff
        run: |
          ruff check src tests


      - name: Black
        run: |
          black --check src tests


      - name: Mypy
        run: |
          mypy src/jobintel


      - name: Alembic upgrade
        run: |
          alembic upgrade head


      - name: Verify Alembic head
        run: |
          alembic current
          alembic heads


      - name: Tests
        run: |
          pytest -q


  docker:

    name: Docker Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Validate Docker Compose
        run: |
          docker compose config


      - name: Build application image
        run: |
          docker build \
            -t job-intelligence:ci \
            .
