services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: jobintel-postgres

    environment:
      POSTGRES_DB: jobintel
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: jobintel_dev

    ports:
      - "55432:5432"

    volumes:
      - jobintel_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U jobintel -d jobintel"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  temporal-postgres:
    image: postgres:17
    container_name: jobintel-temporal-postgres

    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal

    volumes:
      - jobintel_temporal_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U temporal -d temporal"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: jobintel-temporal

    depends_on:
      temporal-postgres:
        condition: service_healthy

    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres

    ports:
      - "7233:7233"


  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: jobintel-temporal-ui

    depends_on:
      - temporal

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000

    ports:
      - "8080:8080"


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: jobintel-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jobintel_prometheus:/prometheus

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"


  grafana:
    image: grafana/grafana:12.1.1
    container_name: jobintel-grafana

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: jobintel_dev
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - jobintel_grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"


volumes:

  jobintel_postgres:

  jobintel_temporal_postgres:

  jobintel_prometheus:

  jobintel_grafana:
