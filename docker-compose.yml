services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: jobintel-postgres

    environment:
      POSTGRES_DB: ${JOBINTEL_POSTGRES_DB}
      POSTGRES_USER: ${JOBINTEL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JOBINTEL_POSTGRES_PASSWORD}

    ports:
      - "55432:5432"

    volumes:
      - jobintel_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${JOBINTEL_POSTGRES_USER} -d ${JOBINTEL_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  temporal-postgres:
    image: postgres:17
    container_name: jobintel-temporal-postgres

    environment:
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB}
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD}

    volumes:
      - jobintel_temporal_postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TEMPORAL_POSTGRES_USER} -d ${TEMPORAL_POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  temporal:
    image: temporalio/auto-setup:1.29.7
    container_name: jobintel-temporal

    depends_on:
      temporal-postgres:
        condition: service_healthy

    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: temporal-postgres

    ports:
      - "7233:7233"

    restart: unless-stopped


  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: jobintel-temporal-ui

    depends_on:
      temporal:
        condition: service_started

    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: ${TEMPORAL_UI_CORS_ORIGINS:-http://localhost:3000}

    ports:
      - "8080:8080"

    restart: unless-stopped


  migrate:
    image: job-intelligence:local

    build:
      context: .
      dockerfile: Dockerfile

    container_name: jobintel-migrate

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: ${JOBINTEL_DOCKER_DATABASE_URL}

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    restart: "no"

    healthcheck:
      disable: true


  api:
    image: job-intelligence:local
    container_name: jobintel-api

    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: ${JOBINTEL_DOCKER_DATABASE_URL}
      JOBINTEL_TEMPORAL_ADDRESS: ${JOBINTEL_TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
      JOBINTEL_TEMPORAL_NAMESPACE: ${JOBINTEL_TEMPORAL_NAMESPACE:-default}
      JOBINTEL_TEMPORAL_TASK_QUEUE: ${JOBINTEL_TEMPORAL_TASK_QUEUE:-job-intelligence-pipeline}

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "jobintel.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://127.0.0.1:8000/health || exit 1"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3


  worker:
    image: job-intelligence:local
    container_name: jobintel-worker

    depends_on:
      migrate:
        condition: service_completed_successfully
      temporal:
        condition: service_started

    env_file:
      - path: .env
        required: false

    environment:
      DATABASE_URL: ${JOBINTEL_DOCKER_DATABASE_URL}
      JOBINTEL_TEMPORAL_ADDRESS: ${JOBINTEL_TEMPORAL_ADDRESS_DOCKER:-temporal:7233}
      JOBINTEL_TEMPORAL_NAMESPACE: ${JOBINTEL_TEMPORAL_NAMESPACE:-default}
      JOBINTEL_TEMPORAL_TASK_QUEUE: ${JOBINTEL_TEMPORAL_TASK_QUEUE:-job-intelligence-pipeline}

    command:
      [
        "python",
        "-m",
        "jobintel.temporal_pipeline.worker"
      ]

    ports:
      - "9101:9101"

    restart: unless-stopped

    healthcheck:
      disable: true


  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: jobintel-prometheus

    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - jobintel_prometheus:/prometheus

    ports:
      - "9090:9090"

    restart: unless-stopped


  grafana:
    image: grafana/grafana:12.1.1
    container_name: jobintel-grafana

    depends_on:
      prometheus:
        condition: service_started

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - jobintel_grafana:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    restart: unless-stopped


volumes:

  jobintel_postgres:

  jobintel_temporal_postgres:

  jobintel_prometheus:

  jobintel_grafana:
