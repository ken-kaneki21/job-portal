services:
  postgres:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${ACCEPTANCE_PG_PORT}:5432"
    restart: "no"
  temporal-postgres:
    container_name: !reset null
    restart: "no"
  temporal:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${ACCEPTANCE_TEMPORAL_PORT}:7233"
    restart: "no"
